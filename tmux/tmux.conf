# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set-option -g prefix C-b
set-option -g prefix2 none

set -g detach-on-destroy off

# Utility bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# # Move between panes
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# Resize panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
# maximize panes
bind -r m resize-pane -Z

# disable kill accept prompt
bind x kill-pane

# mouse support
set -g mouse on

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

# Sesh keybind (fast session switcher with fzf preview)
bind "K" display-popup -E -w 85% -h 85% "sesh connect \$(
    sesh list -t -c | fzf --height 100% --reverse --border=none \
    --border-label ' sesh ' --prompt '⚡  ' \
    --header '🔑 ^a all | ^t tmux | ^g conf | ^x zoxide | ^r rename | ^d tmux kill | ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(🛸  )+reload(sesh list)' \
    --bind 'ctrl-t:change-prompt(◧  )+reload(sesh list -t)' \
    --bind 'ctrl-g:change-prompt(⛯  )+reload(sesh list -c)' \
    --bind 'ctrl-x:change-prompt(🗃  )+reload(sesh list -z)' \
    --bind 'ctrl-f:change-prompt(🔭  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(👽  )+reload(sesh list -t)' \
    --preview-window 'right:55%' \
    --preview '~/.config/tmux/sesh-preview.sh {}' \
)"

# tmux goodies
bind -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"
bind n command-prompt "new-session -s '%%'"

# tmux display popups
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi" # yazi float
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh" # quick floating terminal
bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit" # lazygit float
bind d display-menu -T "#[align=centre]Config" -x C -y C \
    ".zshrc"            z  "display-popup -w 85% -h 85% -E 'nvim ~/.zsh/.zshrc'" \
    ".zprofile"         p  "display-popup -w 85% -h 85% -E 'nvim ~/.zsh/.zprofile'" \
    ".tmux.conf"        t  "display-popup -w 85% -h 85% -E 'nvim ~/.config/tmux/tmux.conf'" \
    ".nvim"             v  "display-popup -w 95% -h 95% -d '~/.config/nvim/' -E 'nvim ~/.config/nvim/'" \
    "quit"              q  ""

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence configuration
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#[fg=#{@thm_red}],#[fg=#{@thm_blue}]}#[bold] #S #[default]"
set -ga status-left "#[fg=#{@thm_overlay_0}]│ "
set -ga status-left "#[fg=#{@thm_maroon},bold] #{=/-32/...:#{s|$HOME|~|:pane_current_path}} #[default]"
set -ga status-left "#{?window_zoomed_flag,#[fg=#{@thm_overlay_0}]│ #[fg=#{@thm_yellow}] zoom ,}"

# status right look and feel
set -g status-right-length 250
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#[fg=#{@thm_red}],#[fg=#{@thm_green}]}#[bold]#{battery_icon} #{battery_percentage}#[default]"
set -ga status-right " #[fg=#{@thm_teal}]󰖩 #{online_status}#[default]"
set -ga status-right " #[fg=#{@thm_blue}]󰭦 %Y-%m-%d#[default]"
set -ga status-right " #[fg=#{@thm_mauve}]󰥔 %H:%M "

# Configure Tmux status bar
set -g status-position bottom
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=default,fg=#{@thm_mauve}"
setw -g pane-border-style "bg=default,fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Active vs Inactive Window Highlighting (Rounded Pills)
set -g window-status-format "#[fg=#{@thm_overlay_1},bg=default] #I: #W "
set -g window-status-current-format "#[fg=#{@thm_blue},bg=default]#[fg=#{@thm_bg},bg=#{@thm_blue},bold]#I: #W#[fg=#{@thm_blue},bg=default]"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator " "

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last
