;; MinhChien Custom Modern Polybar Modules

[module/mascot]
type = custom/text
content = " ⚡ minhchien "
content-background = ${color.background-alt}
content-foreground = ${color.lavender}
content-font = 1

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

ws-icon-0 = 1;󰈹
ws-icon-1 = 2;󰆍
ws-icon-2 = 3;󰨞
ws-icon-3 = 4;󰓇
ws-icon-4 = 5;󰙯
ws-icon-default = 󰍹

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${color.red}
label-mode-background = ${color.background-alt}

label-focused = " %icon%  %name% "
label-focused-foreground = ${color.pink}
label-focused-background = ${color.background-alt}
label-focused-underline = ${color.lavender}
label-focused-padding = 0

label-unfocused = " %icon%  %name% "
label-unfocused-foreground = ${color.comment}
label-unfocused-background = ${color.background}
label-unfocused-padding = 0

label-visible = " %icon%  %name% "
label-visible-foreground = ${color.foreground}
label-visible-background = ${color.background}
label-visible-padding = 0

label-urgent = " %icon%  %name% "
label-urgent-foreground = ${color.red}
label-urgent-background = ${color.background-alt}
label-urgent-padding = 0

[module/title]
type = internal/xwindow
format = <label>
format-prefix = " 󰌽 "
format-prefix-foreground = ${color.teal}
label = "%title:0:30:...%"
label-foreground = ${color.foreground-alt}

[module/date]
type = internal/date
interval = 1.0
date = "󰸗 %a %b %d"
time = "󰥔 %I:%M %p"
format = <label>
format-background = ${color.background-alt}
format-foreground = ${color.peach}
format-padding = 2
label = "%date%  %time%"

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = " 󰍛 "
format-prefix-foreground = ${color.sapphire}
label = "%percentage%% "
label-foreground = ${color.foreground}

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-prefix = " 󰘚 "
format-prefix-foreground = ${color.green}
label = "%percentage_used%% "
label-foreground = ${color.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " 󰕾 "
format-volume-prefix-foreground = ${color.yellow}
label-volume = "%percentage%% "
label-volume-foreground = ${color.foreground}

format-muted = <label-muted>
format-muted-prefix = " 󰝟 "
format-muted-prefix-foreground = ${color.comment}
label-muted = "Muted "
label-muted-foreground = ${color.comment}

[module/brightness]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format-prefix = " 󰃠 "
format-prefix-foreground = ${color.rosewater}
label = "%percentage%% "
label-foreground = ${color.foreground}

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = ADP1
poll-interval = 2

format-charging = <label-charging>
format-charging-prefix = " 󰂄 "
format-charging-prefix-foreground = ${color.green}
label-charging = "%percentage%% "

format-discharging = <label-discharging>
format-discharging-prefix = " 󰁹 "
format-discharging-prefix-foreground = ${color.peach}
label-discharging = "%percentage%% "

format-full = <label-full>
format-full-prefix = " 󰁹 "
format-full-prefix-foreground = ${color.green}
label-full = "100% "

[module/sysmenu]
type = custom/text
content = " 󰐥 "
content-foreground = ${color.red}
click-left = ~/.config/polybar/minhchien/scripts/powermenu.sh &
