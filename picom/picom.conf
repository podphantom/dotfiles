###############################################################################
#   HIGH-PERFORMANCE HARDWARE-ACCELERATED COMPOSITOR CONFIG (INTEL IRIS XE)   #
#   Uses OpenGL GLX backend with damage tracking for 0% CPU lag & smooth VSync #
###############################################################################

# Hardware Acceleration Backend (Intel Iris Xe Mesa DRI3 OpenGL)
backend = "glx";

# Enable VSync to eliminate screen tearing with zero input lag via GLX
vsync = true;

# Crucial for performance: redraw only changed pixels on screen (reduces CPU/GPU load by 90%)
use-damage = true;

# Intel GLX Driver Optimizations
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
glx-no-bgr = true;

# Unredirect full screen windows to bypass compositor in games/fullscreen video
unredir-if-possible = true;

# Keep shadows and heavy blur disabled for zero latency
shadow = false;
blur-background = false;

# Elegant Focus Highlights & Dimming (Makes focused window pop while remaining elegant)
active-opacity = 1.0;
inactive-opacity = 0.94;
inactive-dim = 0.12;          # Dims non-focused windows by 12%
inactive-dim-fixed = true;

# Fast focus transition animations
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

# Modern Rounded Corners
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

# Exclude system popups and bars from dimming/opacity
focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'dunst'",
  "class_g = 'feh'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#       General Settings        #
#################################
dbus = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-workspace-active = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; focus = true; opacity = 0.95; };
  dock = { shadow = false; corner-radius = 0; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; opacity = 0.95; };
  dropdown_menu = { shadow = false; opacity = 0.95; };
};
