# Ultra-Low Latency X11 Compositor Config for i3wm + Intel Iris Xe
backend = "xrender";
vsync = false;
use-damage = true;

# Unredirect full screen windows
unredir-if-possible = true;

# Keep shadows and heavy blur disabled for zero latency
shadow = false;
blur-background = false;

# Opacity & High-Performance Transparency (Zero-Lag XRender)
active-opacity = 0.96;
inactive-opacity = 0.88;
inactive-dim = 0.0;

# Disable fading animations completely for instant window focus & typing
fading = false;

# Disable rounded corners to eliminate GPU clipping mask overhead
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

# Exclude system popups and bars from dimming/opacity
focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'dunst'",
  "class_g = 'feh'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#       General Settings        #
#################################
dbus = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-workspace-active = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; focus = true; opacity = 0.95; };
  dock = { shadow = false; corner-radius = 0; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; opacity = 0.95; };
  dropdown_menu = { shadow = false; opacity = 0.95; };
};
